plugins { id 'com.android.application' }

android {
    namespace 'com.kovak.floatchrome'
    compileSdk 34

    defaultConfig {
        applicationId "com.kovak.floatchrome"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        resConfigs "en"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }

    lint { abortOnError false }
}

dependencies { }
